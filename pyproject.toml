[build-system]
requires = ["uv_build>=0.11.00,<0.12.0"]

build-backend = "uv_build"

[project]
name = "shipaw"
version = "0.3.95"
description = "Shipping client"
authors = [
    { name = "pawrequest", email = "shipaw+pawrequest@users.noreply.github.com" }
]
license = "MIT"

readme = "README.md"
requires-python = ">= 3.13"
dependencies = [
    "apc-hypaship>=0.1.13",
    "pawdf>=0.1.3",
    "royal-mail-combined>=0.0.35",
    "pawlogger>=0.1.11",
    #
    "httpx>=0.28.1",
    "pygments>=2.21.0",
    "pydantic[email]>=2.14.3",
    "fastapi[standard]>=0.162.4",
    "jinja2>=3.1.6",
    "hatchling>=1.33.0",
    "loguru>=0.7.3",
    "thefuzz>=0.22.1",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.16.2",
    "phonenumbers>=9.0.43",
    "pywin32>=312",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
v4 = [
    "pawlogger>=0.1.11",
    #
    "nicegui>=4.0.0",
    "pywebview>=6.2.1",
]

[project.urls]
Homepage = "https://github.com/pawrequest/shipaw"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]


[tool.ruff]
line-length = 120
format.quote-style = "single"

#[tool.uv.sources]
#royal-mail-combined = { path = "../royal-mail-combined", editable = true }
#pawlogger = { path = '../../pawlogger', editable = true }

[tool.uv.build-backend]
source-includes = ["src/shipaw/ui/**"]
